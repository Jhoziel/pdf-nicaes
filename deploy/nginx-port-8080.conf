server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/pdf-nicaes;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location = /build-info.js {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(app\.js|diagnostics\.js|pcl-domain\.js|tre-pcl-domain\.js|review-domain\.js|zip-writer\.js|archive-import\.js|ocr-loader\.js|styles\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /assets/nicaes-logo-white.png {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/vendor/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
